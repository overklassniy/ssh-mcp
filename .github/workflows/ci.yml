# CI workflow: runs build, vet, and tests on every push to master and
# on every pull request targeting master. Ensures that dependency bumps
# (including Dependabot PRs) and feature branches are validated before
# merge.
name: ci

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "assets/**"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "assets/**"

permissions:
  contents: read

jobs:
  test:
    name: Build, vet, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -short
