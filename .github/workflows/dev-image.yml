# Dev image workflow: builds and pushes :dev and :latest tagged images on
# pushes to master that touch Go source, dependencies, or the Dockerfile.
# No GitHub Release is created.
#
# Produces:
#   - Container images tagged :dev and :latest on GHCR and Docker Hub
#     (linux/amd64, linux/arm64).
#
# The :latest tag is pushed here so that docker pull ...:latest always
# works, even before any release tag is created. When a release tag (v*)
# is pushed, the release workflow overwrites :latest with the released
# version.
#
# Triggered only by changes that can affect image content; docs-only
# pushes do not rebuild. Use workflow_dispatch to force a rebuild (e.g.
# after a base image refresh).
#
# Required secrets for Docker Hub (GHCR uses the automatic GITHUB_TOKEN):
#   DOCKERHUB_USERNAME - Docker Hub account name.
#   DOCKERHUB_TOKEN    - Docker Hub access token (not the password).
name: dev-image

on:
  push:
    branches:
      - master
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/dev-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and push dev image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}:dev
            ghcr.io/${{ github.repository }}:latest
            docker.io/${{ vars.DOCKERHUB_IMAGE || 'overklassniy/ssh-mcp' }}:dev
            docker.io/${{ vars.DOCKERHUB_IMAGE || 'overklassniy/ssh-mcp' }}:latest
          build-args: |
            VERSION=dev-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
