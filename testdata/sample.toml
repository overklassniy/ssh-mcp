# Sample ssh-mcp configuration for tests.

[defaults]
command_timeout    = "30s"
connection_timeout = "30s"
sftp_timeout       = "5m"
shell_ready_timeout = "10s"
max_output_bytes   = 10485760
keepalive_interval = "10s"
keepalive_count_max = 3
pty                = true
transport          = "exec"

[[server]]
name     = "dev"
host     = "1.2.3.4"
port     = 22
username = "alice"
password = "secret"
whitelist      = ["^ls( .*)?", "^cat .*"]
allowed_remote_paths = ["/var/log", "/srv"]

[[server]]
name     = "bastion"
host     = "bastion.example.com"
port     = 22
username = "ops"
password = "pwd123456"
transport = "shell"
shell_ready_timeout = "15s"
