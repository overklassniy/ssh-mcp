<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">ssh-mcp: secure, scoped SSH access for AI assistants</title>
  <desc id="heroDesc">Project hero for ssh-mcp, an MCP server that gives AI clients a small, auditable set of SSH tools. Light technical layout with a terminal prompt motif and a connection line drawn from an agent node to a remote node through a policy gate.</desc>

  <!-- Canvas: light background so the hero reads on GitHub light theme. -->
  <rect x="0" y="0" width="1200" height="360" fill="#FFFFFF"/>

  <!-- Thin frame rule, one stroke weight. -->
  <rect x="24" y="24" width="1152" height="312" rx="8" ry="8" fill="none" stroke="#D0D7DE" stroke-width="1"/>

  <!-- Grid motif: faint vertical rule at the column split, subordinate to content. -->
  <g stroke="#EAEEF2" stroke-width="1">
    <line x1="600" y1="40" x2="600" y2="320"/>
  </g>

  <!-- Left column: identity. Fades and lifts in on load.
       Base values stay visible so static renderers (GitHub fallback,
       layer extraction) show the settled composition; SMIL holds the
       hidden state via values/keyTimes until each element's entrance. -->
  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" text-rendering="geometricPrecision">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.2;1" dur="1s" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 12;0 12;0 0" keyTimes="0;0.2;1" dur="1s" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1" fill="freeze"/>

    <!-- Eyebrow: mono metadata. -->
    <text x="64" y="92" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="18" fill="#656D76" letter-spacing="2">
      MCP SERVER / SSH
    </text>

    <!-- Title. -->
    <text x="64" y="168" font-size="64" font-weight="700" fill="#1F2328" letter-spacing="-1">
      ssh-mcp
    </text>

    <!-- One-line value. -->
    <text x="64" y="212" font-size="24" fill="#3B434B">
      Secure, scoped SSH access for AI assistants.
    </text>

    <!-- Mono metadata row, separated by a thin rule. -->
    <line x1="64" y1="244" x2="560" y2="244" stroke="#D0D7DE" stroke-width="1"/>
    <text x="64" y="276" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="16" fill="#656D76" letter-spacing="1">
      Go 1.26  |  stdio  |  8 tools  |  MIT
    </text>
  </g>

  <!-- Right column: project-native motif. Terminal prompt fades in from the right. -->
  <g id="terminal" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" text-rendering="geometricPrecision">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4286;1" dur="1.4s" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="12 0;12 0;0 0" keyTimes="0;0.4286;1" dur="1.4s" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1" fill="freeze"/>

    <!-- Terminal prompt block. -->
    <rect x="648" y="92" width="480" height="92" rx="6" ry="6" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
    <text x="668" y="124" font-size="18" fill="#656D76">
      ssh-mcp $ <tspan fill="#1F2328">execute-command</tspan>
    </text>
    <text x="668" y="156" font-size="16" fill="#656D76">
      &gt; Run df -h on the web server
    </text>

    <!-- Cursor block at end of prompt line; blinks to signal a live terminal. -->
    <rect x="944" y="108" width="10" height="18" fill="#1F2328">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="1.06s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Connection line: agent -> remote, the scoped bridge. Group fades in,
       then the line draws left to right through the policy gate. -->
  <g id="connection" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" text-rendering="geometricPrecision">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.8571;1" dur="1.4s" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1" fill="freeze"/>
    <line x1="688" y1="244" x2="1083" y2="244" stroke="#1F2328" stroke-width="1.5" stroke-dasharray="400">
      <animate attributeName="stroke-dashoffset" values="400;400;0" keyTimes="0;0.5455;1" dur="2.2s" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1" fill="freeze"/>
    </line>
    <circle cx="688" cy="244" r="5" fill="#1F2328"/>
    <circle cx="1088" cy="244" r="5" fill="none" stroke="#1F2328" stroke-width="1.5"/>
    <text x="664" y="276" font-size="14" fill="#656D76" text-anchor="start">
      agent
    </text>
    <text x="1092" y="276" font-size="14" fill="#656D76" text-anchor="end">
      remote
    </text>
  </g>

  <!-- Policy gate mark on the connection line; appears once the bridge is drawn. -->
  <g id="policy-gate" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" text-rendering="geometricPrecision">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.7692;1" dur="2.6s" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 -6;0 -6;0 0" keyTimes="0;0.7692;1" dur="2.6s" calcMode="spline" keySplines="0 0 1 1;0.25 0.1 0.25 1" fill="freeze"/>
    <rect x="864" y="236" width="48" height="16" rx="3" ry="3" fill="#FFFFFF" stroke="#1F2328" stroke-width="1"/>
    <text x="888" y="248" font-size="11" fill="#1F2328" text-anchor="middle">
      policy
    </text>
  </g>
</svg>
